<div class="min-h-screen bg-gray-50 dark:bg-slate-950 transition-colors flex flex-col justify-center py-12 sm:px-6 lg:px-8">
 <div class="sm:mx-auto sm:w-full sm:max-w-md">
 <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900 dark:text-white">
 Reset your password
 </h2>
 <p class="mt-2 text-center text-sm text-gray-600 dark:text-slate-400">
 Or
 <a routerLink="/login" class="font-medium text-indigo-600 hover:text-indigo-500">
 return to sign in
 </a>
 </p>
 </div>

 <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
 <div class="bg-white dark:bg-slate-900 transition-colors py-8 px-4 shadow dark:shadow-none sm:rounded-lg sm:px-10">
 <form class="space-y-6" (ngSubmit)="onSubmit()" *ngIf="!successMessage">
 <div>
 <label for="email" class="block text-sm font-medium text-gray-700 dark:text-slate-300">
 Email address
 </label>
 <div class="mt-1">
 <input id="email" name="email" type="email" autocomplete="email" required [(ngModel)]="email"
 class="appearance-none block w-full px-3 py-2 bg-transparent dark:bg-slate-800/50 text-gray-900 dark:text-white border border-gray-300 dark:border-slate-600 rounded-md shadow-sm dark:shadow-none placeholder-gray-400 dark:placeholder-slate-500 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
 </div>
 </div>

 <div>
 <button type="submit" [disabled]="isLoading"
 class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm dark:shadow-none text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed">
 <svg *ngIf="isLoading" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white"
 xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
 <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
 </circle>
 <path class="opacity-75" fill="currentColor"
 d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
 </path>
 </svg>
 {{ isLoading ? 'Sending link...' : 'Send Reset Link' }}
 </button>
 </div>
 </form>

 <!-- Success Message -->
 <div *ngIf="successMessage" class="rounded-md bg-green-50 p-4">
 <div class="flex">
 <div class="flex-shrink-0">
 <svg class="h-5 w-5 text-green-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"
 fill="currentColor" aria-hidden="true">
 <path fill-rule="evenodd"
 d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
 clip-rule="evenodd" />
 </svg>
 </div>
 <div class="ml-3">
 <h3 class="text-sm font-medium text-green-800">
 Check your email
 </h3>
 <div class="mt-2 text-sm text-green-700">
 <p>{{ successMessage }}</p>
 </div>
 <div class="mt-4">
 <div class="-mx-2 -my-1.5 flex">
 <a routerLink="/login"
 class="bg-green-50 px-2 py-1.5 rounded-md text-sm font-medium text-green-800 hover:bg-green-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-green-50 focus:ring-green-600">
 Return to login
 </a>
 </div>
 </div>
 </div>
 </div>
 </div>
 </div>
 </div>
</div>
