<div *ngIf="alert$ | async as alert" class="fixed inset-0 z-[9999] overflow-y-auto" aria-labelledby="modal-title"
 role="dialog" aria-modal="true">
 <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
 <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true" (click)="close()">
 </div>
 <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
 <div
 class="inline-block align-bottom bg-white dark:bg-slate-900 transition-colors rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full">
 <div class="bg-white dark:bg-slate-900 transition-colors px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
 <div class="sm:flex sm:items-start">
 <div [ngClass]="{
 'bg-green-100': alert.type === 'success',
 'bg-red-100': alert.type === 'error',
 'bg-yellow-100': alert.type === 'warning',
 'bg-blue-100': alert.type === 'info'
 }" class="mx-auto flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full sm:mx-0 sm:h-10 sm:w-10">
 <!-- Success Icon -->
 <svg *ngIf="alert.type === 'success'" class="h-6 w-6 text-green-600" fill="none"
 viewBox="0 0 24 24" stroke="currentColor">
 <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
 </svg>
 <!-- Error Icon -->
 <svg *ngIf="alert.type === 'error'" class="h-6 w-6 text-red-600" fill="none" viewBox="0 0 24 24"
 stroke="currentColor">
 <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
 d="M6 18L18 6M6 6l12 12" />
 </svg>
 <!-- Warning Icon -->
 <svg *ngIf="alert.type === 'warning'" class="h-6 w-6 text-yellow-600" fill="none"
 viewBox="0 0 24 24" stroke="currentColor">
 <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
 d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
 </svg>
 <!-- Info Icon -->
 <svg *ngIf="alert.type === 'info'" class="h-6 w-6 text-blue-600 dark:text-blue-400" fill="none" viewBox="0 0 24 24"
 stroke="currentColor">
 <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
 d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
 </svg>
 </div>
 <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
 <h3 class="text-lg leading-6 font-medium text-gray-900 dark:text-white" id="modal-title">
 {{ alert.title }}
 </h3>
 <div class="mt-2">
 <p class="text-sm text-gray-500 dark:text-slate-400">
 {{ alert.message }}
 </p>
 </div>
 </div>
 </div>
 </div>
 <div class="bg-gray-50 dark:bg-slate-950 transition-colors px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
 <button type="button" (click)="close()"
 class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm dark:shadow-none px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:ml-3 sm:w-auto sm:text-sm">
 OK
 </button>
 </div>
 </div>
 </div>
</div>
